                tabAdmin.className = inactiveTabClass;
                schoolGroup.classList.remove('hidden');
                adminGroup.classList.add('hidden');
            };

            tabAdmin.onclick = () => {
                mode = 'admin';
                tabAdmin.className = activeTabClass;
                tabSekolah.className = inactiveTabClass;
                adminGroup.classList.remove('hidden');
                schoolGroup.classList.add('hidden');
            };

            // Toggle Password Visibility untuk Sekolah
            const toggleSchoolBtn = document.getElementById('toggle-school-pass');
            if (toggleSchoolBtn) {
                toggleSchoolBtn.onclick = () => {
                    const passInput = document.getElementById('school-pass-input');
                    const icon = document.getElementById('toggle-school-pass-icon');
                    if (passInput.type === 'password') {
                        passInput.type = 'text';
                        icon.className = 'fa-solid fa-eye-slash text-sm text-emerald-400';
                    } else {
                        passInput.type = 'password';
                        icon.className = 'fa-solid fa-eye text-sm text-slate-500';
                    }
                };
            }

            // Toggle Password Visibility untuk Admin
            const toggleAdminBtn = document.getElementById('toggle-admin-pass');
            if (toggleAdminBtn) {
                toggleAdminBtn.onclick = () => {
                    const passInput = document.getElementById('admin-pass-input');
                    const icon = document.getElementById('toggle-admin-pass-icon');
                    if (passInput.type === 'password') {
                        passInput.type = 'text';
                        icon.className = 'fa-solid fa-eye-slash text-sm text-emerald-400';
                    } else {
                        passInput.type = 'password';
                        icon.className = 'fa-solid fa-eye text-sm text-slate-500';
                    }
                };
            }

            // Quick Fill Demo Login Function
            window.fillDemoLogin = function(npsn, password) {
                const npsnInput = document.getElementById('npsn-input');
                const passInput = document.getElementById('school-pass-input');
                if (npsnInput && passInput) {
                    npsnInput.value = npsn;
                    passInput.value = password;
                    showToast(`Kredensial demo (${npsn}) berhasil diisikan!`, "success");
                }
            };

            document.getElementById('login-form').onsubmit = (e) => {
                e.preventDefault();
                const errBox = document.getElementById('login-error');
                const errText = document.getElementById('error-text');
                
                if (mode === 'sekolah') {
                    const npsnVal = document.getElementById('npsn-input').value.trim();
                    const passVal = document.getElementById('school-pass-input').value;

                    if (npsnVal.length < 7 || npsnVal.length > 8) {
                        errText.textContent = "NPSN harus terdiri dari 7 atau 8 digit angka.";
                        errBox.classList.remove('hidden');
                        return;
                    }

                    if (!passVal) {
                        errText.textContent = "Masukkan kata sandi sekolah Anda.";
                        errBox.classList.remove('hidden');
                        return;
                    }

                    // Cari akun sekolah berdasarkan NPSN
                    const foundSchool = State.schools.find(s => s.npsn === npsnVal);

                    if (!foundSchool) {
                        errText.textContent = "NPSN belum terdaftar. Silakan hubungi Admin Dinas untuk membuatkan akun sekolah.";
                        errBox.classList.remove('hidden');
                        return;
                    }

                    // Verifikasi password (jika akun tidak memiliki password khusus, password default adalah NPSN)
                    const validPassword = foundSchool.password || foundSchool.npsn;
                    if (passVal !== validPassword) {
                        errText.textContent = "Kata sandi sekolah salah. Pastikan password yang dimasukkan tepat.";
                        errBox.classList.remove('hidden');
                        return;
                    }

                    State.role = 'school';
                    State.npsn = npsnVal;
                    State.activeMenu = 'beranda';
                } else {
                    const pass = document.getElementById('admin-pass-input').value;
                    if (pass !== 'admin123') {

                        errBox.classList.remove('hidden');
                        return;
                    }
                    State.role = 'admin';
                    State.activeMenu = 'dashboard';
                }
                showToast("Login berhasil! Selamat datang di SIPRASA Kutai Timur.", "success");
                render();
            };
        }

        function renderAdminMainDashboard(total, draf, perbaikan, verified) {
            let totalBaikCount = 0;
            let totalRusakCount = 0;
            let totalUnitCount = 0;

            const categoryMap = {
                'Ruang Kelas': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Ruang Perpustakaan': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Ruang Guru / Kantor': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Ruang UKS': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Sanitasi / Toilet': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Mebelair': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Alat TIK': { total: 0, baik: 0, rusak: 0, usulan: 0 }
            };

            State.schools.forEach(s => {
                (s.inventaris || []).forEach(inv => {
                    let catName = 'Mebelair';
                    const lower = (inv.namaBarang || '').toLowerCase();
                    if(lower.includes('komputer') || lower.includes('tik') || lower.includes('laptop')) catName = 'Alat TIK';
                    else if(lower.includes('meja') || lower.includes('kursi') || lower.includes('lemari') || lower.includes('papan')) catName = 'Mebelair';
                    
                    if(categoryMap[catName]) {
                        categoryMap[catName].total += (inv.jumlahTotal || 0);
                        categoryMap[catName].baik += (inv.jumlahBaik || 0);
                        categoryMap[catName].rusak += (inv.jumlahRusak || 0);
                    }
                    totalBaikCount += (inv.jumlahBaik || 0);
                    totalRusakCount += (inv.jumlahRusak || 0);
                    totalUnitCount += (inv.jumlahTotal || 0);
                });

                (s.ruangan || []).forEach(r => {
                    let catName = 'Ruang Kelas';
                    const kat = (r.kategoriRuang || '').toLowerCase();
                    if(kat.includes('perpustakaan')) catName = 'Ruang Perpustakaan';
                    else if(kat.includes('guru') || kat.includes('kepala')) catName = 'Ruang Guru / Kantor';
                    else if(kat.includes('uks')) catName = 'Ruang UKS';
                    else if(kat.includes('toilet') || kat.includes('sanitasi')) catName = 'Sanitasi / Toilet';

                    if(categoryMap[catName]) {
                        categoryMap[catName].total += 1;
                        if(r.kondisi === 'Baik') categoryMap[catName].baik += 1;
                        else categoryMap[catName].rusak += 1;
                    }
                    totalUnitCount += 1;
                    if(r.kondisi === 'Baik') totalBaikCount += 1; else totalRusakCount += 1;
                });

                (s.usulan || []).forEach(u => {
                    const jb = (u.jenisBantuan || '').toLowerCase();
                    let targetCat = 'Ruang Kelas';
                    if(jb.includes('perpustakaan')) targetCat = 'Ruang Perpustakaan';
                    else if(jb.includes('guru') || jb.includes('kantor')) targetCat = 'Ruang Guru / Kantor';
                    else if(jb.includes('uks')) targetCat = 'Ruang UKS';
                    else if(jb.includes('sanitasi') || jb.includes('toilet')) targetCat = 'Sanitasi / Toilet';
                    else if(jb.includes('mebelair')) targetCat = 'Mebelair';
                    else if(jb.includes('tik') || jb.includes('komputer')) targetCat = 'Alat TIK';

                    if(categoryMap[targetCat]) {
                        categoryMap[targetCat].usulan += 1;
                    }
                });
            });

            if(totalUnitCount === 0) {
                totalUnitCount = 100;
                totalBaikCount = 80;
                totalRusakCount = 20;
            }

            const pctBaik = Math.round((totalBaikCount / totalUnitCount) * 100);
            const pctRusak = 100 - pctBaik;
            const categories = Object.keys(categoryMap).map(k => ({ name: k, ...categoryMap[k] }));
            const maxUsulan = Math.max(...categories.map(c => c.usulan), 5);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-slate-500">Total Sekolah</p><h3 class="text-3xl font-black text-slate-900 mt-1">${total}</h3></div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-rose-600">Perlu Perbaikan</p><h3 class="text-3xl font-black text-rose-600 mt-1">${perbaikan}</h3></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-emerald-600">Terverifikasi Valid</p><h3 class="text-3xl font-black text-emerald-600 mt-1">${verified}</h3></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-lg flex flex-col items-center justify-center text-center space-y-3">
                            <h4 class="text-xs font-black text-slate-700 uppercase tracking-wider">Diagram Kondisi Fisik Total</h4>
                            <div class="relative w-36 h-36 rounded-full flex items-center justify-center shadow-inner transition-all hover:scale-105 duration-300" style="background: conic-gradient(#10b981 0% ${pctBaik}%, #f43f5e ${pctBaik}% 100%);">
                                <div class="w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center shadow-md">
                                    <span class="text-[10px] font-bold text-slate-500">Total Unit</span>
                                    <span class="text-xs font-black text-slate-900">${totalUnitCount > 1000 ? (totalUnitCount/1000).toFixed(1)+'k' : totalUnitCount}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 text-[11px] font-bold">
                                <span class="flex items-center gap-1.5 text-emerald-700"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Baik (${pctBaik}%)</span>
                                <span class="flex items-center gap-1.5 text-rose-700"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span> Rusak (${pctRusak}%)</span>
                            </div>
                        </div>

                        <div class="md:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-lg space-y-3 flex flex-col justify-between">
                            <div class="flex justify-between items-center">
                                <h4 class="text-xs font-black text-slate-700 uppercase tracking-wider">Kurva Tren Volume Usulan per Kategori Sarpras</h4>

            // --- Kalkulasi Presisi Kondisi Fisik Gedung & Ruangan ---

                totalRusak += rusak;

        function openAdminAddSchoolModal() {
            const m = document.getElementById('modal-admin-add-school');
            if(m) {
                document.getElementById('admin-add-npsn').value = '';
                document.getElementById('admin-add-password').value = '';
                document.getElementById('admin-add-nama').value = '';
                document.getElementById('admin-add-kec').value = '';
                hideAdminAddSchoolError();
                m.classList.remove('hidden');
            }
        }
        window.openAdminAddSchoolModal = openAdminAddSchoolModal;

        function closeAdminAddSchoolModal() {
            const m = document.getElementById('modal-admin-add-school');
            if(m) m.classList.add('hidden');
            hideAdminAddSchoolError();
        }
        window.closeAdminAddSchoolModal = closeAdminAddSchoolModal;

        function showAdminAddSchoolError(msg) {
            const errBox = document.getElementById('admin-add-school-error');
            const errText = document.getElementById('admin-add-school-error-text');
            if(errBox && errText) {
                errText.textContent = msg;
                errBox.classList.remove('hidden');
            }
        }

        function hideAdminAddSchoolError() {
            const errBox = document.getElementById('admin-add-school-error');
            if(errBox) errBox.classList.add('hidden');
        }
        window.hideAdminAddSchoolError = hideAdminAddSchoolError;

        function autoGeneratePassword() {
            const npsn = document.getElementById('admin-add-npsn').value.trim();
            if(npsn) {
                document.getElementById('admin-add-password').value = "sd" + npsn;
            } else {
                const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
                let pass = "";
                for(let i=0; i<8; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
                document.getElementById('admin-add-password').value = pass;
            }
        }
        window.autoGeneratePassword = autoGeneratePassword;

        function openEditPasswordModal(idx) {
            State.passwordEditIndex = idx;
            const school = State.schools[idx];
            if(!school) return;
            document.getElementById('edit-pass-school-name').textContent = school.nama;
            document.getElementById('edit-pass-npsn').textContent = "NPSN: " + school.npsn;
            document.getElementById('edit-pass-input').value = school.password || school.npsn;
            document.getElementById('modal-edit-password').classList.remove('hidden');
        }
        window.openEditPasswordModal = openEditPasswordModal;

        function closeEditPasswordModal() {
            document.getElementById('modal-edit-password').classList.add('hidden');
            State.passwordEditIndex = null;
        }
        window.closeEditPasswordModal = closeEditPasswordModal;

        function handleSavePasswordEdit(e) {
            e.preventDefault();
            if(State.passwordEditIndex === null) return;
            const newPass = document.getElementById('edit-pass-input').value.trim();
            if(!newPass) {
                showToast("Kata sandi tidak boleh kosong.", "error");
                return;
            }
            State.schools[State.passwordEditIndex].password = newPass;
            syncDataToServer(State.schools[State.passwordEditIndex]);
            showToast("Kata sandi sekolah berhasil diperbarui.", "success");
            closeEditPasswordModal();
            render();
        }
        window.handleSavePasswordEdit = handleSavePasswordEdit;

        function confirmDeleteSchool(idx) {
            State.deleteTargetType = 'school';
            State.deleteTargetIndex = idx;
            const m = document.getElementById('modal-delete-confirm');
            if(m) m.classList.remove('hidden');
        }
        window.confirmDeleteSchool = confirmDeleteSchool;

        function closeDeleteModal() {
            const m = document.getElementById('modal-delete-confirm');
            if(m) m.classList.add('hidden');
            State.deleteTargetType = null;
            State.deleteTargetIndex = null;
        }
        window.closeDeleteModal = closeDeleteModal;

        function executeDeleteSchool() {
            if (State.deleteTargetType === 'school' && State.deleteTargetIndex !== null) {
                State.schools.splice(State.deleteTargetIndex, 1);
                showToast("Data dan akun sekolah berhasil dihapus.", "success");
            }
            closeDeleteModal();
            render();
        }

        function searchLocationMap() {
            const query = document.getElementById('location-search-input').value.trim();
            if(!query) return;
            let lat = '0.505295';
            let lng = '117.514038';
            const qLower = query.toLowerCase();
            if(qLower.includes('sangatta')) { lat = '0.493984'; lng = '117.546265'; }
            else if(qLower.includes('bengalon')) { lat = '0.8521'; lng = '117.8214'; }
            else if(qLower.includes('sangkulirang')) { lat = '1.1245'; lng = '118.0123'; }
            else if(qLower.includes('samarinda')) { lat = '-0.5021'; lng = '117.1537'; }
            else if(qLower.includes('balikpapan')) { lat = '-1.2379'; lng = '116.8529'; }

            document.getElementById('sch-lat').value = lat;
            document.getElementById('sch-lng').value = lng;
            document.getElementById('map-preview-frame').src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
            showToast("Lokasi berhasil ditemukan di peta.", "success");
        }
        window.searchLocationMap = searchLocationMap;

        function getCurrentDeviceGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('sch-lat').value = lat;
                    document.getElementById('sch-lng').value = lng;
                    document.getElementById('map-preview-frame').src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
                    showToast("GPS berhasil mendeteksi koordinat Anda.", "success");
                }, () => {
                    showToast("Gagal mendeteksi GPS. Perangkat tidak mengizinkan.", "error");
                });
            } else {
                showToast("Geolokasi tidak didukung oleh browser ini.", "error");
            }
        }
        window.getCurrentDeviceGPS = getCurrentDeviceGPS;

            return `
                <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 max-w-3xl mx-auto space-y-5 text-xs">

                                            <button onclick="toggleEditDokumen('${school.npsn}', ${idx})" class="px-3 py-1.5 bg-amber-50 text-amber-800 font-bold rounded-lg text-[11px] border border-amber-200 hover:bg-amber-100"><i class="fa-solid fa-pen mr-1"></i> Edit</button>
                                            <button onclick="deleteDokumen('${school.npsn}', ${idx})" class="text-rose-600 hover:text-rose-800 p-2 font-bold" title="Hapus"><i class="fa-solid fa-trash"></i></button>

        function handleFileUpload(e, npsn) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const school = State.schools.find(s => s.npsn === npsn);
                if(school) {
                    if(!school.dokumen) school.dokumen = [];
                    const sizeMB = (file.size / (1024*1024)).toFixed(1) + ' MB';
                    school.dokumen.push({
                        id: Date.now().toString(),
                        namaFile: file.name,
                        kategori: 'Dokumen Sekolah',
                        ukuran: sizeMB,
                        waktuUnggah: new Date().toISOString().split('T')[0],
                        url: evt.target.result,
                        isEditing: false
                    });
                    syncDataToServer(school);
                    showToast("Dokumen berhasil diunggah.", "success");
                    render();
                }
            };
            reader.readAsDataURL(file);
        }
        window.handleFileUpload = handleFileUpload;

        function toggleEditDokumen(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.dokumen[idx]) {
                school.dokumen[idx].isEditing = !school.dokumen[idx].isEditing;
                render();
            }
        }
        window.toggleEditDokumen = toggleEditDokumen;

        function saveEditDokumen(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.dokumen[idx]) {
                const newName = document.getElementById(`edit-dok-nama-${idx}`).value.trim();
                const newKat = document.getElementById(`edit-dok-kat-${idx}`).value;
                if(newName) school.dokumen[idx].namaFile = newName;
                school.dokumen[idx].kategori = newKat;
                school.dokumen[idx].isEditing = false;
                syncDataToServer(school);
                showToast("Perubahan dokumen berhasil disimpan.", "success");
                render();
            }
        }
        window.saveEditDokumen = saveEditDokumen;

        function deleteDokumen(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.dokumen) {
                school.dokumen.splice(idx, 1);
                syncDataToServer(school);
                showToast("Dokumen berhasil dihapus.", "success");
                render();
            }
        }
        window.deleteDokumen = deleteDokumen;

        function openViewFile(title, url, category) {
            const m = document.getElementById('modal-view-file');
            const t = document.getElementById('view-file-title');
            const container = document.getElementById('view-file-container');
            if(m && t && container) {
                t.textContent = "Pratinjau: " + title;
                if(url && (url.startsWith('data:image/') || url.match(/\.(jpeg|jpg|png|gif)$/i))) {
                    container.innerHTML = `<img src="${url}" class="w-full h-full object-contain"/>`;
                } else if(url && (url.startsWith('data:application/pdf') || url.match(/\.pdf$/i))) {
                    container.innerHTML = `<iframe src="${url}" class="w-full h-full" frameborder="0"></iframe>`;
                } else if(url) {
                    container.innerHTML = `<iframe src="${url}" class="w-full h-full" frameborder="0"></iframe>`;
                } else {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center p-8 text-center space-y-3">
                            <div class="w-16 h-16 bg-blue-100 text-blue-800 rounded-full flex items-center justify-center text-2xl font-bold">
                                <i class="fa-solid fa-file-pdf"></i>
                            </div>
                            <div>
                                <h4 class="font-black text-slate-900 text-sm">${title}</h4>
                                <p class="text-xs text-slate-500 mt-1">Dokumen resmi terverifikasi sistem SIPRASA Kutai Timur.</p>
                            </div>
                        </div>
                    `;
                }
                m.classList.remove('hidden');
            }
        }
        window.openViewFile = openViewFile;

        function deleteUsulan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.usulan) {
                school.usulan.splice(idx, 1);
                syncDataToServer(school);
                showToast("Usulan berhasil dihapus.", "success");
                render();
            }
        }
        window.deleteUsulan = deleteUsulan;

        function renderSchoolKirim(school) {
            return `
                <div class="bg-white p-10 rounded-2xl shadow-xl border border-slate-200 max-w-xl mx-auto text-center space-y-5 text-xs">
                    <div class="w-16 h-16 bg-emerald-50 rounded-2xl mx-auto flex items-center justify-center border border-emerald-100 shadow-inner">
                        <i class="fa-solid fa-paper-plane text-2xl text-emerald-600"></i>

                    <p class="text-slate-600 font-medium leading-relaxed">Pastikan seluruh isian profil, tanah, bangunan, ruangan, inventaris, utilitas, dan usulan sarpras telah diisi dengan benar sebelum dikirimkan ke Admin Dinas Pendidikan.</p>
                    <button onclick="sendSchoolData('${school.npsn}')" class="w-full py-3.5 bg-emerald-700 text-white font-black rounded-xl shadow-lg hover:bg-emerald-800 transition-all text-xs flex items-center justify-center gap-2"><i class="fa-solid fa-paper-plane"></i> Kirim Data Sekarang ke Admin Dinas</button>

                    <div class="mt-4 p-5 rounded-xl border text-left ${school.status === 'Terverifikasi' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : school.status === 'Perlu Perbaikan' ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-slate-50 border-slate-200 text-slate-800'}">
                        <div class="flex items-center gap-2.5 font-black text-sm mb-1.5">
                            <i class="fa-solid ${school.status === 'Terverifikasi' ? 'fa-circle-check text-emerald-600' : school.status === 'Perlu Perbaikan' ? 'fa-triangle-exclamation text-rose-600' : 'fa-circle-info text-blue-600'}"></i>

                        <p class="text-[11px] leading-relaxed opacity-90 font-medium">
                            ${school.status === 'Terverifikasi' ? 'Data instrumen sarpras sekolah Anda telah berhasil diterima dan divalidasi oleh Tim Admin Dinas Pendidikan Kabupaten Kutai Timur.' : school.status === 'Perlu Perbaikan' ? 'Admin Dinas meminta revisi/perbaikan pada data sekolah Anda. Silakan cek catatan di Beranda atau menu terkait.' : 'Data Anda tersimpan dalam sistem. Klik tombol hijau di atas untuk mengirimkan pembaruan data secara resmi ke Dinas.'}
                        </p>
                        ${school.catatanAdmin ? `<div class="mt-2.5 pt-2.5 border-t border-current/20 text-[11px] font-bold">Catatan Admin: ${school.catatanAdmin}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function handleTambahUsulan(e, npsn) {
            e.preventDefault();
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                if(!school.usulan) school.usulan = [];
                school.usulan.push({
                    id: Date.now().toString(),
                    jenisBantuan: document.getElementById('usul-jenis').value,
                    volume: document.getElementById('usul-volume').value,
                    prioritas: document.getElementById('usul-prioritas').value,
                    alasan: document.getElementById('usul-alasan').value,
                    tanggalUsul: new Date().toISOString().split('T')[0]
                });
                syncDataToServer(school);
                showToast("Usulan sarpras berhasil ditambahkan.", "success");
                render();
            }
        }

        function sendSchoolData(npsn) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                school.status = 'Terverifikasi';
                syncDataToServer(school);
                showToast("Data berhasil dikirim ke Admin Dinas.", "success");
                render();
            }
        }

        function openBangunanModal(npsn) {
            document.getElementById('bangunan-npsn').value = npsn;
            document.getElementById('bangunan-idx').value = "-1";
            document.getElementById('modal-bangunan-title').textContent = "Tambah Data Gedung";
            document.getElementById('b-nama').value = "";
            document.getElementById('b-kondisi').value = "Baik";
            document.getElementById('b-tahun').value = "2020";
            document.getElementById('b-lantai').value = "1";
            document.getElementById('b-luas').value = "100";
            document.getElementById('modal-bangunan').classList.remove('hidden');
        }
        window.openBangunanModal = openBangunanModal;

        function closeBangunanModal() {
            document.getElementById('modal-bangunan').classList.add('hidden');
        }
        window.closeBangunanModal = closeBangunanModal;

        function saveBangunanForm(e) {
            e.preventDefault();
            const npsn = document.getElementById('bangunan-npsn').value;
            const idx = parseInt(document.getElementById('bangunan-idx').value);
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                if(!school.bangunan) school.bangunan = [];
                const data = {
                    id: idx >= 0 ? school.bangunan[idx].id : Date.now().toString(),
                    namaBangunan: document.getElementById('b-nama').value,
                    kondisi: document.getElementById('b-kondisi').value,
                    tahunBangun: parseInt(document.getElementById('b-tahun').value) || 2020,
                    jumlahLantai: parseInt(document.getElementById('b-lantai').value) || 1,
                    luasBangunan: parseFloat(document.getElementById('b-luas').value) || 100
                };
                if(idx >= 0) {
                    school.bangunan[idx] = data;
                    showToast("Data gedung diperbarui.", "success");
                } else {
                    school.bangunan.push(data);
                    showToast("Data gedung ditambahkan.", "success");
                }
                syncDataToServer(school);
                closeBangunanModal();
                render();
            }
        }
        window.saveBangunanForm = saveBangunanForm;

        function editBangunan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);

                const b = school.bangunan[idx];
                document.getElementById('bangunan-npsn').value = npsn;
                document.getElementById('bangunan-idx').value = idx;
                document.getElementById('modal-bangunan-title').textContent = "Edit Data Gedung";
                document.getElementById('b-nama').value = b.namaBangunan;
                document.getElementById('b-kondisi').value = b.kondisi;
                document.getElementById('b-tahun').value = b.tahunBangun;
                document.getElementById('b-lantai').value = b.jumlahLantai;
                document.getElementById('b-luas').value = b.luasBangunan;

                school.bangunan.splice(idx, 1);
                syncDataToServer(school);
                showToast("Data gedung dihapus.", "success");
                render();

        }
        window.deleteBangunan = deleteBangunan;

        function openRuanganModal(npsn) {

            e.preventDefault();
            const npsn = document.getElementById('ruangan-npsn').value;
            const idx = parseInt(document.getElementById('ruangan-idx').value);

                    school.ruangan[idx] = data;
                    showToast("Data ruangan diperbarui.", "success");

                    school.ruangan.push(data);
                    showToast("Data ruangan ditambahkan.", "success");
                }
                syncDataToServer(school);
                closeRuanganModal();
                render();
            }
        }
        window.saveRuanganForm = saveRuanganForm;

        function editRuangan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.ruangan[idx]) {
                const r = school.ruangan[idx];
                document.getElementById('ruangan-npsn').value = npsn;

                document.getElementById('r-kondisi').value = r.kondisi;

                document.getElementById('modal-ruangan').classList.remove('hidden');

            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.ruangan) {
                school.ruangan.splice(idx, 1);
                syncDataToServer(school);
                showToast("Data ruangan dihapus.", "success");
                render();
            }
        }
        window.deleteRuangan = deleteRuangan;

        function openInventarisModal(npsn) {
            const modal = document.getElementById('modal-inventaris');
            if(!modal) return;
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.bangunan) {
                const selectGedung = document.getElementById('i-gedung');
                if(selectGedung) {
                    selectGedung.innerHTML = school.bangunan.length > 0 
                        ? school.bangunan.map(b => `<option value="${b.namaBangunan}">${b.namaBangunan}</option>`).join('')
                        : '<option value="Gedung Utama">Gedung Utama (Default)</option>';
                }
            }
            document.getElementById('inventaris-npsn').value = npsn;
            document.getElementById('inventaris-idx').value = "-1";
            document.getElementById('modal-inventaris-title').textContent = "Tambah Inventaris Barang";
            document.getElementById('i-nama').value = "";
            document.getElementById('i-total').value = "50";
            document.getElementById('i-baik').value = "45";
            modal.classList.remove('hidden');
        }
        window.openInventarisModal = openInventarisModal;

        function closeInventarisModal() {
            const modal = document.getElementById('modal-inventaris');
            if(modal) modal.classList.add('hidden');
        }
        window.closeInventarisModal = closeInventarisModal;

        function saveInventarisForm(e) {
            e.preventDefault();
            const npsn = document.getElementById('inventaris-npsn').value;
            const idx = parseInt(document.getElementById('inventaris-idx').value);
            const total = parseInt(document.getElementById('i-total').value) || 0;
            const baik = parseInt(document.getElementById('i-baik').value) || 0;
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                if(!school.inventaris) school.inventaris = [];
                const data = {
                    id: idx >= 0 ? school.inventaris[idx].id : Date.now().toString(),
                    namaGedung: document.getElementById('i-gedung').value,
                    namaBarang: document.getElementById('i-nama').value,
                    jumlahTotal: total,
                    jumlahBaik: baik,
                    jumlahRusak: Math.max(0, total - baik)
                };
                if(idx >= 0) {
                    school.inventaris[idx] = data;
                    showToast("Inventaris diperbarui.", "success");
                } else {
                    school.inventaris.push(data);
                    showToast("Inventaris ditambahkan.", "success");
                }
                syncDataToServer(school);
                closeInventarisModal();
                render();
            }
        }
        window.saveInventarisForm = saveInventarisForm;

        function editInventaris(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.inventaris[idx]) {
                const i = school.inventaris[idx];
                openInventarisModal(npsn);
                document.getElementById('inventaris-idx').value = idx;
                document.getElementById('modal-inventaris-title').textContent = "Edit Inventaris Barang";
                document.getElementById('i-gedung').value = i.namaGedung || '';
                document.getElementById('i-nama').value = i.namaBarang;
                document.getElementById('i-total').value = i.jumlahTotal;
                document.getElementById('i-baik').value = i.jumlahBaik;
            }
        }
        window.editInventaris = editInventaris;

        function deleteInventaris(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.inventaris) {
                school.inventaris.splice(idx, 1);
                syncDataToServer(school);
                showToast("Inventaris dihapus.", "success");
                render();
            }
        }
        window.deleteInventaris = deleteInventaris;

        // Fetch data awal dari server jika tersedia
        async function fetchInitialData() {
            if (!SCRIPT_URL || SCRIPT_URL.includes("MASUKKAN")) return;
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                if (data && data.status === "success" && Array.isArray(data.schools) && data.schools.length > 0) {
                    State.schools = data.schools;
                    render();
                }
            } catch (err) {
                console.warn("Menggunakan data lokal awal.");
            }
        }

        // Initialize App on Load
        window.onload = () => {
            render();
            fetchInitialData();
        };
    </script>
</body>
</html>
