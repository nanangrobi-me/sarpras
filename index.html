    <!-- Application JavaScript -->

        // --- Hubungkan URL Web App Google Apps Script di sini ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNp0uRRonx-QYSqQ_Ov7JHcaxVvyQxlEKp6cCW3U0yUbXePtc24xAzOqzkEa0GgKVa/exec";

        // --- Fungsi Sinkronisasi Data Otomatis ke Backend Apps Script & Spreadsheet ---
        async function syncDataToServer(schoolData) {
            if (!SCRIPT_URL || SCRIPT_URL.includes("MASUKKAN")) return;
            try {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(schoolData)
                });
            } catch (err) {
                console.error("Gagal sinkronisasi ke server:", err);
            }
        }

        // --- State Management ---
        const State = {
            role: null, // 'admin' | 'school' | null
            npsn: '',
            activeMenu: 'dashboard',
            schools: [

                    ],

                {

                    kepalaSekolah: 'Siti Aminah, S.Pd',

            selectedSchoolForAdmin: null,

            toast: null,
            deleteTargetType: null,
            deleteTargetIndex: null
        };

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const el = document.createElement('div');
            el.className = `px-5 py-3 rounded-xl shadow-xl backdrop-blur-xl text-white font-bold flex items-center gap-3 border border-white/10 text-xs animate-fade-in ${type === 'success' ? 'bg-slate-900/90' : 'bg-rose-600/90'}`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation'}"></i> ${msg}`;
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 4000);
        }

        // --- Render Engine ---
        function render() {
            const app = document.getElementById('app');
            if (!State.role) {
                app.innerHTML = renderLoginScreen();
                attachLoginEvents();
            } else if (State.role === 'admin') {
                app.innerHTML = renderAdminDashboard();
            } else if (State.role === 'school') {
                app.innerHTML = renderSchoolDashboard();
            }
        }

        // --- Login Screen ---
        function renderLoginScreen() {
            return `
                <div class="min-h-screen flex w-full bg-slate-950 overflow-hidden font-sans">
                    <div class="hidden lg:flex w-5/12 bg-gradient-to-br from-slate-950 via-blue-950 to-indigo-950 text-white flex-col justify-between p-12 relative overflow-hidden">
                        <div class="absolute inset-0 z-0">
                            <img src="https://i.ibb.co.com/chs4HNwN/Burung-Enggang-Kalimantan-Hewan-Khas-Kalimantan-Timur-yang-Menjadi-Simbol-Kehormatan-Suku-Dayak.webp" alt="Burung Enggang" class="w-full h-full object-cover opacity-85 scale-105"/>
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-blue-950/70 to-slate-950/60 backdrop-blur-[1px]"></div>
                        </div>
                        <div class="relative z-10">
                            <div class="flex items-center gap-3.5 mb-16">
                                <div class="bg-white/10 backdrop-blur-xl p-2 rounded-xl border border-white/20 shadow-xl flex items-center justify-center w-14 h-14">
                                    <img src="https://i.ibb.co.com/wZd5Vn8h/Logo-Kabupaten-Kutai-Timur.png" alt="Logo Kutai Timur" class="w-full h-full object-contain"/>
                                </div>
                                <div>
                                    <h2 class="text-xl font-black tracking-wider text-white">SIPRASA</h2>
                                    <p class="text-[11px] text-blue-400 uppercase tracking-widest font-extrabold">Kutai Timur</p>
                                </div>
                            </div>
                            <h1 class="text-4xl font-black leading-tight mb-4 tracking-tight text-white drop-shadow-md">
                                Sistem Informasi <br/>
                                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400">Sarana & Prasarana</span>
                            </h1>

                        </div>
                        <div class="relative z-10 flex items-center gap-2.5 text-xs text-slate-300 font-semibold">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Secure Government Cloud &bull; 2026</span>
                        </div>
                    </div>
                    <div class="w-full lg:w-7/12 flex items-center justify-center p-6 sm:p-10 bg-gradient-to-br from-slate-50 via-white to-blue-50/30 relative overflow-y-auto">
                        <div class="w-full max-w-sm my-auto relative z-10">
                            <div class="mb-6">
                                <h2 class="text-2xl font-black text-slate-900 mb-1.5 tracking-tight">Portal Masuk Resmi</h2>
                                <p class="text-slate-500 text-xs sm:text-sm font-medium">Pilih jenis akun Anda untuk mengakses sistem pendataan sarpras.</p>
                            </div>
                            <div class="flex bg-slate-200/70 p-1 rounded-xl mb-5 border border-slate-300/60 shadow-inner">
                                <button type="button" id="tab-sekolah" class="flex-1 py-2.5 text-xs font-extrabold rounded-lg transition-all bg-white shadow-md text-blue-950">Login Sekolah (NPSN)</button>
                                <button type="button" id="tab-admin" class="flex-1 py-2.5 text-xs font-extrabold rounded-lg transition-all text-slate-500 hover:text-slate-800">Login Admin Dinas</button>
                            </div>
                            <div id="login-error" class="hidden mb-5 p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-bold flex items-center gap-2.5">

                            </div>

                                <div id="school-input-group">
                                    <label class="block text-[11px] font-bold text-slate-600 uppercase tracking-wider mb-1.5">Nomor Pokok Sekolah Nasional (NPSN) <span class="text-rose-500">*</span></label>

                                    <p class="text-[10px] text-slate-400 mt-1">Contoh NPSN demo: 12345678, 87654321, 11223344</p>
                                </div>

                                    <input type="password" id="admin-pass-input" placeholder="Masukkan kata sandi (admin123)" class="w-full px-3.5 py-3 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-600/10 focus:border-blue-700 transition-all outline-none text-slate-800 bg-slate-50 font-medium text-sm shadow-inner"/>
                                </div>
                                <button type="submit" class="w-full py-3 text-xs sm:text-sm shadow-lg bg-gradient-to-r from-blue-900 via-blue-800 to-indigo-900 text-white font-bold rounded-xl hover:shadow-xl transition-all flex items-center justify-center gap-2">
                                    <span>Masuk ke Dashboard</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        function attachLoginEvents() {
            let mode = 'sekolah';
            const tabSekolah = document.getElementById('tab-sekolah');
            const tabAdmin = document.getElementById('tab-admin');
            const schoolGroup = document.getElementById('school-input-group');
            const adminGroup = document.getElementById('admin-input-group');
            
            tabSekolah.onclick = () => {
                mode = 'sekolah';
                tabSekolah.className = 'flex-1 py-2.5 text-xs font-extrabold rounded-lg transition-all bg-white shadow-md text-blue-950';
                tabAdmin.className = 'flex-1 py-2.5 text-xs font-extrabold rounded-lg transition-all text-slate-500 hover:text-slate-800';
                schoolGroup.classList.remove('hidden');
                adminGroup.classList.add('hidden');
            };

            tabAdmin.onclick = () => {
                mode = 'admin';
                tabAdmin.className = 'flex-1 py-2.5 text-xs font-extrabold rounded-lg transition-all bg-white shadow-md text-blue-950';
                tabSekolah.className = 'flex-1 py-2.5 text-xs font-extrabold rounded-lg transition-all text-slate-500 hover:text-slate-800';
                adminGroup.classList.remove('hidden');
                schoolGroup.classList.add('hidden');
            };

            document.getElementById('login-form').onsubmit = (e) => {
                e.preventDefault();
                const errBox = document.getElementById('login-error');
                const errText = document.getElementById('error-text');
                
                if (mode === 'sekolah') {
                    const val = document.getElementById('npsn-input').value.trim();
                    if (val.length < 7 || val.length > 8) {
                        errText.textContent = "NPSN harus terdiri dari 7 atau 8 digit angka.";
                        errBox.classList.remove('hidden');
                        return;
                    }
                    State.role = 'school';
                    State.npsn = val;
                    State.activeMenu = 'beranda';
                    if(!State.schools.find(s => s.npsn === val)) {
                        State.schools.push({ 
                            npsn: val, 
                            nama: 'Sekolah Dasar Negeri ' + val, 
                            status: 'Draf', 
                            kecamatan: 'Sangatta Utara', 
                            alamat: 'Kutai Timur',
                            kepalaSekolah: 'Kepala Sekolah, S.Pd',
                            nipKepsek: '19700101 199503 1 001',
                            jumlahSiswa: 150,
                            jumlahGuru: 10,
                            lat: '0.505295',
                            lng: '117.514038',
                            tanah:[], bangunan:[], ruangan:[], inventaris:[], dokumen:[], usulan:[], utilitas:{ sumberAir:'PDAM', sumberListrik:'PLN', dayaListrik:2200, internet:'Fiber Optic (Indihome/dll)' } 
                        });
                    }
                } else {
                    const pass = document.getElementById('admin-pass-input').value;
                    if (pass !== 'admin123') {
                        errText.textContent = "Kata sandi Admin salah (gunakan admin123).";
                        errBox.classList.remove('hidden');
                        return;
                    }
                    State.role = 'admin';
                    State.activeMenu = 'dashboard';
                }
                showToast("Login berhasil!", "success");
                render();
            };
        }

        // --- Admin Dashboard ---
        function renderAdminDashboard() {
            if (State.selectedSchoolForAdmin) {
                return renderAdminSchoolDetail();
            }
            if (State.selectedUsulanForAdmin) {
                return renderAdminUsulanDetailModal();
            }

            const total = State.schools.length;
            const verified = State.schools.filter(s => s.status === 'Terverifikasi').length;
            const perbaikan = State.schools.filter(s => s.status === 'Perlu Perbaikan').length;
            const draf = State.schools.filter(s => s.status === 'Draf' || s.status === 'Dikirim').length;

            const isRekapActive = State.activeMenu === 'rekap-semua' || State.activeMenu === 'semua-usulan' || State.activeMenu === 'grafik-sarpras';

                        </div>

                                        <i class="fa-solid fa-school-flag w-4"></i>
                                        <span>Data & Rekap Sekolah</span>
                                    </div>

                                </button>
                                <div id="admin-dropdown-menu" class="${isRekapActive ? '' : 'hidden'} pl-3 space-y-1 pt-1">
                                    <button onclick="State.activeMenu='rekap-semua';render();" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-bold text-xs ${State.activeMenu==='rekap-semua'?'bg-blue-600 text-white shadow-md':'text-slate-400 hover:bg-white/10 hover:text-white'}">
                                        <i class="fa-solid fa-list-check w-3.5"></i> Rekap Semua Sekolah
                                    </button>
                                    <button onclick="State.activeMenu='semua-usulan';render();" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-bold text-xs ${State.activeMenu==='semua-usulan'?'bg-blue-600 text-white shadow-md':'text-slate-400 hover:bg-white/10 hover:text-white'}">
                                        <i class="fa-solid fa-file-invoice w-3.5"></i> Daftar Semua Usulan
                                    </button>
                                    <button onclick="State.activeMenu='grafik-sarpras';render();" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg font-bold text-xs ${State.activeMenu==='grafik-sarpras'?'bg-blue-600 text-white shadow-md':'text-slate-400 hover:bg-white/10 hover:text-white'}">
                                        <i class="fa-solid fa-chart-line w-3.5"></i> Grafik Analitik
                                    </button>
                                </div>
                            </div>
                        </nav>
                        <div class="p-3.5 border-t border-slate-800">
                            <button onclick="State.role=null;render();" class="flex items-center gap-3 px-3.5 py-2.5 w-full rounded-xl text-rose-400 hover:bg-rose-500/10 font-bold text-xs"><i class="fa-solid fa-right-from-bracket w-4"></i> Keluar Akun</button>
                        </div>
                    </aside>
                    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">

                                <span class="text-[10px] font-extrabold uppercase tracking-widest text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full border border-blue-100">Dinas Pendidikan Kabupaten Kutai Timur</span>

                            </div>
                        </header>
                        <div class="flex-1 overflow-auto p-6 space-y-6">
                            ${
                                State.activeMenu === 'dashboard' ? renderAdminMainDashboard(total, draf, perbaikan, verified) :
                                State.activeMenu === 'rekap-semua' ? renderAdminRekapSekolah() :
                                State.activeMenu === 'grafik-sarpras' ? renderAdminGrafikSarpras() :
                                renderAdminSemuaUsulan()
                            }
                        </div>

        function renderAdminMainDashboard(total, draf, perbaikan, verified) {
            let totalBaikCount = 0;
            let totalRusakCount = 0;
            let totalUnitCount = 0;

            const categoryMap = {
                'Ruang Kelas': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Ruang Perpustakaan': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Ruang Guru / Kantor': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Ruang UKS': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Sanitasi / Toilet': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Mebelair': { total: 0, baik: 0, rusak: 0, usulan: 0 },
                'Alat TIK': { total: 0, baik: 0, rusak: 0, usulan: 0 }
            };

            State.schools.forEach(s => {
                (s.inventaris || []).forEach(inv => {
                    let catName = 'Mebelair';
                    const lower = (inv.namaBarang || '').toLowerCase();
                    if(lower.includes('komputer') || lower.includes('tik') || lower.includes('laptop')) catName = 'Alat TIK';
                    else if(lower.includes('meja') || lower.includes('kursi') || lower.includes('lemari') || lower.includes('papan')) catName = 'Mebelair';
                    
                    if(categoryMap[catName]) {
                        categoryMap[catName].total += (inv.jumlahTotal || 0);
                        categoryMap[catName].baik += (inv.jumlahBaik || 0);
                        categoryMap[catName].rusak += (inv.jumlahRusak || 0);
                    }
                    totalBaikCount += (inv.jumlahBaik || 0);
                    totalRusakCount += (inv.jumlahRusak || 0);
                    totalUnitCount += (inv.jumlahTotal || 0);
                });

                (s.ruangan || []).forEach(r => {
                    let catName = 'Ruang Kelas';
                    const kat = (r.kategoriRuang || '').toLowerCase();
                    if(kat.includes('perpustakaan')) catName = 'Ruang Perpustakaan';
                    else if(kat.includes('guru') || kat.includes('kepala')) catName = 'Ruang Guru / Kantor';
                    else if(kat.includes('uks')) catName = 'Ruang UKS';
                    else if(kat.includes('toilet') || kat.includes('sanitasi')) catName = 'Sanitasi / Toilet';

                    if(categoryMap[catName]) {
                        categoryMap[catName].total += 1;
                        if(r.kondisi === 'Baik') categoryMap[catName].baik += 1;
                        else categoryMap[catName].rusak += 1;
                    }
                    totalUnitCount += 1;
                    if(r.kondisi === 'Baik') totalBaikCount += 1; else totalRusakCount += 1;
                });

                (s.usulan || []).forEach(u => {
                    const jb = (u.jenisBantuan || '').toLowerCase();
                    let targetCat = 'Ruang Kelas';
                    if(jb.includes('perpustakaan')) targetCat = 'Ruang Perpustakaan';
                    else if(jb.includes('guru') || jb.includes('kantor')) targetCat = 'Ruang Guru / Kantor';
                    else if(jb.includes('uks')) targetCat = 'Ruang UKS';
                    else if(jb.includes('sanitasi') || jb.includes('toilet')) targetCat = 'Sanitasi / Toilet';
                    else if(jb.includes('mebelair')) targetCat = 'Mebelair';
                    else if(jb.includes('tik') || jb.includes('komputer')) targetCat = 'Alat TIK';

                    if(categoryMap[targetCat]) {
                        categoryMap[targetCat].usulan += 1;
                    }
                });
            });

            if(totalUnitCount === 0) {
                totalUnitCount = 100;
                totalBaikCount = 80;
                totalRusakCount = 20;
            }

            const pctBaik = Math.round((totalBaikCount / totalUnitCount) * 100);
            const pctRusak = 100 - pctBaik;
            const categories = Object.keys(categoryMap).map(k => ({ name: k, ...categoryMap[k] }));
            const maxUsulan = Math.max(...categories.map(c => c.usulan), 5);

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-slate-500">Total Sekolah</p><h3 class="text-3xl font-black text-slate-900 mt-1">${total}</h3></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-blue-600">Pending / Draf</p><h3 class="text-3xl font-black text-blue-600 mt-1">${draf}</h3></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-rose-600">Perlu Perbaikan</p><h3 class="text-3xl font-black text-rose-600 mt-1">${perbaikan}</h3></div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-lg"><p class="text-[10px] font-extrabold uppercase text-emerald-600">Terverifikasi Valid</p><h3 class="text-3xl font-black text-emerald-600 mt-1">${verified}</h3></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-lg flex flex-col items-center justify-center text-center space-y-3">
                            <h4 class="text-xs font-black text-slate-700 uppercase tracking-wider">Diagram Kondisi Fisik Total</h4>
                            <div class="relative w-36 h-36 rounded-full flex items-center justify-center shadow-inner transition-all hover:scale-105 duration-300" style="background: conic-gradient(#10b981 0% ${pctBaik}%, #f43f5e ${pctBaik}% 100%);">
                                <div class="w-24 h-24 bg-white rounded-full flex flex-col items-center justify-center shadow-md">
                                    <span class="text-[10px] font-bold text-slate-500">Total Unit</span>
                                    <span class="text-xs font-black text-slate-900">${totalUnitCount > 1000 ? (totalUnitCount/1000).toFixed(1)+'k' : totalUnitCount}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 text-[11px] font-bold">
                                <span class="flex items-center gap-1.5 text-emerald-700"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span> Baik (${pctBaik}%)</span>
                                <span class="flex items-center gap-1.5 text-rose-700"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span> Rusak (${pctRusak}%)</span>
                            </div>
                        </div>

                        <div class="md:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-lg space-y-3 flex flex-col justify-between">
                            <div class="flex justify-between items-center">
                                <h4 class="text-xs font-black text-slate-700 uppercase tracking-wider">Kurva Tren Volume Usulan per Kategori Sarpras</h4>
                                <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 font-bold text-[10px] rounded-lg">Berdasarkan Isian Sekolah</span>
                            </div>
                            <div class="h-36 w-full flex items-end justify-between px-2 pt-5 pb-2 relative border-b border-l border-slate-200">
                                <div class="absolute inset-x-0 top-0 border-t border-slate-100"></div>
                                <div class="absolute inset-x-0 top-1/2 border-t border-slate-100"></div>
                                
                                ${categories.map((c) => {
                                    const heightPercent = Math.min(100, Math.max(15, (c.usulan / maxUsulan) * 100));
                                    return `
                                        <div class="flex flex-col items-center gap-1.5 z-10 group relative flex-1">
                                            <div class="absolute -top-7 bg-slate-900 text-white text-[9px] font-bold py-1 px-2 rounded-md opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap shadow-md">
                                                ${c.name}: ${c.usulan} Usulan
                                            </div>
                                            <div style="height: ${heightPercent}%" class="w-6 bg-gradient-to-t from-blue-700 to-indigo-500 rounded-t-lg transition-all duration-300 group-hover:bg-blue-600 group-hover:scale-y-105 shadow"></div>
                                            <span class="text-[9px] font-bold text-slate-500 truncate w-14 text-center" title="${c.name}">${c.name.split(' ')[0]}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function searchLocationMap() {
            const query = document.getElementById('location-search-input').value.trim();
            if(!query) return;
            let lat = '0.505295';
            let lng = '117.514038';
            const qLower = query.toLowerCase();
            if(qLower.includes('sangatta')) { lat = '0.493984'; lng = '117.546265'; }
            else if(qLower.includes('bengalon')) { lat = '0.8521'; lng = '117.8214'; }
            else if(qLower.includes('sangkulirang')) { lat = '1.1245'; lng = '118.0123'; }
            else if(qLower.includes('samarinda')) { lat = '-0.5021'; lng = '117.1537'; }
            else if(qLower.includes('balikpapan')) { lat = '-1.2379'; lng = '116.8529'; }

            document.getElementById('sch-lat').value = lat;
            document.getElementById('sch-lng').value = lng;
            document.getElementById('map-preview-frame').src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
            showToast("Lokasi berhasil ditemukan di peta.", "success");
        }
        window.searchLocationMap = searchLocationMap;

        function getCurrentDeviceGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    document.getElementById('sch-lat').value = lat;
                    document.getElementById('sch-lng').value = lng;
                    document.getElementById('map-preview-frame').src = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;
                    showToast("GPS berhasil mendeteksi koordinat Anda.", "success");
                }, () => {
                    showToast("Gagal mendeteksi GPS. Perangkat tidak mengizinkan.", "error");
                });
            } else {
                showToast("Geolokasi tidak didukung oleh browser ini.", "error");
            }
        }
        window.getCurrentDeviceGPS = getCurrentDeviceGPS;

        function handleSitePlanUpload(e, npsn) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const school = State.schools.find(s => s.npsn === npsn);
                if(school) {
                    school.sitePlanUrl = evt.target.result;
                    school.sitePlanName = file.name;
                    showToast("Site Plan berhasil diunggah.", "success");
                    render();
                }
            };
            reader.readAsDataURL(file);
        }
        window.handleSitePlanUpload = handleSitePlanUpload;

        function handleKondisiUpload(e, npsn) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const school = State.schools.find(s => s.npsn === npsn);
                if(school) {
                    school.kondisiAsliUrl = evt.target.result;
                    school.kondisiAsliName = file.name;
                    showToast("Foto kondisi asli berhasil diunggah.", "success");
                    render();
                }
            };
            reader.readAsDataURL(file);
        }
        window.handleKondisiUpload = handleKondisiUpload;

                const school = State.schools.find(s => s.npsn === npsn);
                if(school) {
                    if(!school.dokumen) school.dokumen = [];
                    const sizeMB = (file.size / (1024*1024)).toFixed(1) + ' MB';
                    school.dokumen.push({
                        id: Date.now().toString(),
                        namaFile: file.name,
                        kategori: 'Dokumen Sekolah',
                        ukuran: sizeMB,
                        waktuUnggah: new Date().toISOString().split('T')[0],
                        url: evt.target.result,
                        isEditing: false
                    });
                    showToast("Dokumen berhasil diunggah.", "success");
                    render();
                }
            };
            reader.readAsDataURL(file);
        }

            const idx = parseInt(document.getElementById('bangunan-idx').value);
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                if(!school.bangunan) school.bangunan = [];

                    id: idx >= 0 ? school.bangunan[idx].id : Date.now().toString(),
                    namaBangunan: document.getElementById('b-nama').value,
                    kondisi: document.getElementById('b-kondisi').value,
                    tahunBangun: parseInt(document.getElementById('b-tahun').value) || 2020,
                    jumlahLantai: parseInt(document.getElementById('b-lantai').value) || 1,
                    luasBangunan: parseFloat(document.getElementById('b-luas').value) || 100
                };
                if(idx >= 0) {
                    school.bangunan[idx] = data;

                } else {
                    school.bangunan.push(data);

                }

        window.saveBangunanForm = saveBangunanForm;

        function editBangunan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.bangunan[idx]) {
                const b = school.bangunan[idx];
                document.getElementById('bangunan-npsn').value = npsn;
                document.getElementById('bangunan-idx').value = idx;
                document.getElementById('modal-bangunan-title').textContent = "Edit Data Gedung";
                document.getElementById('b-nama').value = b.namaBangunan;
                document.getElementById('b-kondisi').value = b.kondisi;
                document.getElementById('b-tahun').value = b.tahunBangun;
                document.getElementById('b-lantai').value = b.jumlahLantai;
                document.getElementById('b-luas').value = b.luasBangunan;
                document.getElementById('modal-bangunan').classList.remove('hidden');
            }
        }
        window.editBangunan = editBangunan;

        function deleteBangunan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.bangunan) {
                school.bangunan.splice(idx, 1);
                showToast("Data gedung dihapus.", "success");
                render();
            }
        }
        window.deleteBangunan = deleteBangunan;

        function openRuanganModal(npsn) {
            document.getElementById('ruangan-npsn').value = npsn;
            document.getElementById('ruangan-idx').value = "-1";
            document.getElementById('modal-ruangan-title').textContent = "Tambah Data Ruangan";
            document.getElementById('r-kategori').value = "Ruang Kelas";
            document.getElementById('r-kondisi').value = "Baik";
            document.getElementById('r-luas').value = "64";
            document.getElementById('modal-ruangan').classList.remove('hidden');
        }
        window.openRuanganModal = openRuanganModal;

        function closeRuanganModal() {
            document.getElementById('modal-ruangan').classList.add('hidden');
        }
        window.closeRuanganModal = closeRuanganModal;

        function saveRuanganForm(e) {
            e.preventDefault();
            const npsn = document.getElementById('ruangan-npsn').value;
            const idx = parseInt(document.getElementById('ruangan-idx').value);
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                if(!school.ruangan) school.ruangan = [];
                const data = {
                    id: idx >= 0 ? school.ruangan[idx].id : Date.now().toString(),
                    kategoriRuang: document.getElementById('r-kategori').value,
                    kondisi: document.getElementById('r-kondisi').value,
                    luas: parseFloat(document.getElementById('r-luas').value) || 64
                };
                if(idx >= 0) {
                    school.ruangan[idx] = data;
                    showToast("Data ruangan diperbarui.", "success");
                } else {
                    school.ruangan.push(data);
                    showToast("Data ruangan ditambahkan.", "success");
                }
                closeRuanganModal();
                render();
            }
        }
        window.saveRuanganForm = saveRuanganForm;

        function editRuangan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.ruangan[idx]) {
                const r = school.ruangan[idx];
                document.getElementById('ruangan-npsn').value = npsn;
                document.getElementById('ruangan-idx').value = idx;
                document.getElementById('modal-ruangan-title').textContent = "Edit Data Ruangan";
                document.getElementById('r-kategori').value = r.kategoriRuang;
                document.getElementById('r-kondisi').value = r.kondisi;
                document.getElementById('r-luas').value = r.luas;
                document.getElementById('modal-ruangan').classList.remove('hidden');
            }
        }
        window.editRuangan = editRuangan;

        function deleteRuangan(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.ruangan) {
                school.ruangan.splice(idx, 1);
                showToast("Data ruangan dihapus.", "success");
                render();
            }
        }
        window.deleteRuangan = deleteRuangan;

        function openInventarisModal(npsn) {
            const modal = document.getElementById('modal-inventaris');
            if(!modal) return;
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.bangunan) {
                const selectGedung = document.getElementById('i-gedung');
                if(selectGedung) {
                    selectGedung.innerHTML = school.bangunan.length > 0 
                        ? school.bangunan.map(b => `<option value="${b.namaBangunan}">${b.namaBangunan}</option>`).join('')
                        : '<option value="Gedung Utama">Gedung Utama (Default)</option>';
                }
            }
            document.getElementById('inventaris-npsn').value = npsn;
            document.getElementById('inventaris-idx').value = "-1";
            document.getElementById('modal-inventaris-title').textContent = "Tambah Inventaris Barang";
            document.getElementById('i-nama').value = "";
            document.getElementById('i-total').value = "50";
            document.getElementById('i-baik').value = "45";
            modal.classList.remove('hidden');
        }
        window.openInventarisModal = openInventarisModal;

        function closeInventarisModal() {
            const modal = document.getElementById('modal-inventaris');
            if(modal) modal.classList.add('hidden');
        }
        window.closeInventarisModal = closeInventarisModal;

        function saveInventarisForm(e) {
            e.preventDefault();
            const npsn = document.getElementById('inventaris-npsn').value;
            const idx = parseInt(document.getElementById('inventaris-idx').value);
            const total = parseInt(document.getElementById('i-total').value) || 0;
            const baik = parseInt(document.getElementById('i-baik').value) || 0;
            const school = State.schools.find(s => s.npsn === npsn);
            if(school) {
                if(!school.inventaris) school.inventaris = [];
                const data = {
                    id: idx >= 0 ? school.inventaris[idx].id : Date.now().toString(),
                    namaGedung: document.getElementById('i-gedung').value,
                    namaBarang: document.getElementById('i-nama').value,
                    jumlahTotal: total,
                    jumlahBaik: baik,
                    jumlahRusak: Math.max(0, total - baik)
                };
                if(idx >= 0) {
                    school.inventaris[idx] = data;
                    showToast("Inventaris diperbarui.", "success");
                } else {
                    school.inventaris.push(data);
                    showToast("Inventaris ditambahkan.", "success");
                }
                closeInventarisModal();
                render();
            }
        }
        window.saveInventarisForm = saveInventarisForm;

        function editInventaris(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.inventaris[idx]) {
                const i = school.inventaris[idx];
                openInventarisModal(npsn);
                document.getElementById('inventaris-idx').value = idx;
                document.getElementById('modal-inventaris-title').textContent = "Edit Inventaris Barang";
                document.getElementById('i-gedung').value = i.namaGedung || '';
                document.getElementById('i-nama').value = i.namaBarang;
                document.getElementById('i-total').value = i.jumlahTotal;
                document.getElementById('i-baik').value = i.jumlahBaik;
            }
        }
        window.editInventaris = editInventaris;

        function deleteInventaris(npsn, idx) {
            const school = State.schools.find(s => s.npsn === npsn);
            if(school && school.inventaris) {
                school.inventaris.splice(idx, 1);
                showToast("Inventaris dihapus.", "success");
                render();
            }
        }
        window.deleteInventaris = deleteInventaris;

        // Initialize App on Load
        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
